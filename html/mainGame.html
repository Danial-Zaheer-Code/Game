<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fate Runner - Playing</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			background: url('../images/bg-green1.jpg') no-repeat center center fixed;
			background-size: cover;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			overflow: hidden;
			color: white;
		}

		/* Top HUD Bar */
		.hud-container {
			position: fixed;
			top: 15px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 25px;
			background: rgba(10, 25, 10, 0.85);
			backdrop-filter: blur(10px);
			border: 2px solid #36FF01;
			box-shadow: 0 0 25px rgba(54, 255, 1, 0.4);
			padding: 10px 25px;
			border-radius: 40px;
			z-index: 1000;
			min-width: 650px;
		}

		.hud-item {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 1.1rem;
			font-weight: bold;
			text-shadow: 0 0 8px rgba(54, 255, 1, 0.6);
		}

		.hud-level {
			color: #00E5FF;
		}

		.hud-coins {
			color: #FFD700;
		}

		.hud-mode {
			padding: 4px 12px;
			border-radius: 15px;
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.mode-easy {
			background: #2e7d32;
			color: #a5d6a7;
		}

		.mode-normal {
			background: #f57f17;
			color: #fff59d;
		}

		.mode-hardcore {
			background: #c62828;
			color: #ef9a9a;
			animation: pulseRed 1.5s infinite;
		}

		.hud-lives {
			display: flex;
			align-items: center;
		}

		.game {
			position: relative;
			overflow: hidden;
		}

		.background {
			table-layout: fixed;
			border-spacing: 0;
		}

		.background td {
			padding: 0;
		}

		.lava,
		.actor {
			background: #36FF01;
		}

		.wall {
			background: #444;
			border: solid 3px #333;
			box-sizing: content-box;
		}

		.actor {
			position: absolute;
		}

		.player {
			background: linear-gradient(135deg, #00d2ff, #004bd7);
			border-radius: 4px;
			box-shadow: 0 0 14px #00d2ff;
			transition: height 0.1s ease, top 0.1s ease;
		}

		.lost .player {
			background: #ff3333;
			box-shadow: 0 0 20px #ff0000;
		}

		.won .player {
			background: #00ff66;
			box-shadow: 0 0 20px #00ff66;
		}

		.coin {
			background: radial-gradient(circle, #fff700, #ff8800);
			border-radius: 50%;
			box-shadow: 0 0 12px #ffbb00;
			animation: coinGlow 1.2s infinite alternate;
		}

		.spring {
			background: linear-gradient(180deg, #00ffcc, #008866);
			border-top: 3px solid #ffffff;
			border-radius: 4px 4px 0 0;
			box-shadow: 0 0 15px #00ffcc;
			animation: springPulse 1s infinite alternate;
		}

		.enemy {
			background: linear-gradient(135deg, #09ff00, #00ffb3);
			border-radius: 6px;
			box-shadow: 0 0 14px #09ff00;
			animation: enemyPulse 0.8s infinite alternate;
		}

		.trackingEnemy {
			background: linear-gradient(135deg, #ffaa00, #ff3300);
			border-radius: 50%;
			box-shadow: 0 0 16px #ff3300;
			animation: trackingPulse 0.6s infinite alternate;
		}

		/* Controls Guide Footer */
		.controls-guide {
			position: fixed;
			bottom: 12px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 0.9rem;
			color: rgba(255, 255, 255, 0.8);
			background: rgba(0, 0, 0, 0.7);
			padding: 6px 20px;
			border-radius: 20px;
			border: 1px solid rgba(54, 255, 1, 0.3);
			letter-spacing: 0.5px;
		}

		@keyframes coinGlow {
			from {
				box-shadow: 0 0 8px #ffbb00;
			}

			to {
				box-shadow: 0 0 18px #ffff00;
			}
		}

		@keyframes springPulse {
			from {
				transform: scaleY(0.95);
			}

			to {
				transform: scaleY(1.05);
			}
		}

		@keyframes enemyPulse {
			from {
				box-shadow: 0 0 8px #09ff00;
			}

			to {
				box-shadow: 0 0 18px #00ffb3;
			}
		}

		@keyframes trackingPulse {
			from {
				box-shadow: 0 0 10px #ff3300;
				transform: scale(0.95);
			}

			to {
				box-shadow: 0 0 20px #ffaa00;
				transform: scale(1.05);
			}
		}

		@keyframes pulseRed {
			0% {
				box-shadow: 0 0 5px #ff0000;
			}

			50% {
				box-shadow: 0 0 15px #ff0000;
			}

			100% {
				box-shadow: 0 0 5px #ff0000;
			}
		}
	</style>
</head>

<body>
	<!-- HUD Header -->
	<div class="hud-container">
		<div class="hud-item hud-level" id="hudLevel">Level 1 / 7</div>
		<div class="hud-item hud-coins" id="hudCoins">🪙 0 / 0</div>
		<div class="hud-item">
			<span class="hud-mode mode-normal" id="hudMode">NORMAL</span>
		</div>
		<div class="hud-item hud-lives" id="hudLives"></div>
	</div>

	<!-- Audio -->
	<audio id="bgSound" src="../audio/survive.mp3" loop></audio>

	<!-- Controls Footer -->
	<div class="controls-guide">Controls: <b>WASD</b> or <b>Arrow Keys</b></div>

	<script>
		window.addEventListener('load', () => {
			const audio = document.getElementById('bgSound');
			if (audio) {
				audio.volume = 0.4;
				audio.play().catch(() => {
					const unmute = () => {
						audio.play();
						document.removeEventListener('click', unmute);
						document.removeEventListener('keydown', unmute);
					};
					document.addEventListener('click', unmute);
					document.addEventListener('keydown', unmute);
				});
			}
		});
	</script>
	<script type="module" src="../js/start.js"></script>
</body>

</html>
