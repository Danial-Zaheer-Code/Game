<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fate Runner - Playing</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			background: url('../images/bg-green1.jpg') no-repeat center center fixed;
			background-size: cover;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			overflow: hidden;
			color: white;
		}

		/* Top HUD Bar */
		.hud-container {
			position: fixed;
			top: 15px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 25px;
			background: rgba(10, 25, 10, 0.85);
			backdrop-filter: blur(10px);
			border: 2px solid #36FF01;
			box-shadow: 0 0 25px rgba(54, 255, 1, 0.4);
			padding: 10px 25px;
			border-radius: 40px;
			z-index: 1000;
			min-width: 650px;
		}

		.hud-item {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 1.1rem;
			font-weight: bold;
			text-shadow: 0 0 8px rgba(54, 255, 1, 0.6);
		}

		.hud-level {
			color: #00E5FF;
		}

		.hud-coins {
			color: #FFD700;
		}

		.hud-mode {
			padding: 4px 12px;
			border-radius: 15px;
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.mode-easy {
			background: #2e7d32;
			color: #a5d6a7;
		}

		.mode-normal {
			background: #f57f17;
			color: #fff59d;
		}

		.mode-hardcore {
			background: #c62828;
			color: #ef9a9a;
			animation: pulseRed 1.5s infinite;
		}

		.hud-lives {
			display: flex;
			align-items: center;
		}

		.hud-shield {
			color: #00e5ff;
			font-size: 1.05rem;
			padding: 5px 14px;
			border-radius: 18px;
			border: 1px solid rgba(0, 229, 255, 0.4);
			transition: all 0.3s ease;
			display: flex;
			align-items: center;
		}

		.hud-shield.shield-active {
			background: rgba(0, 229, 255, 0.3);
			border-color: #00e5ff;
			box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
			color: #ffffff;
			animation: activeShieldPulse 1s infinite alternate;
		}

		.hud-shield.shield-inactive {
			background: rgba(255, 255, 255, 0.05);
			color: #888888;
		}

		@keyframes activeShieldPulse {
			from {
				box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
			}

			to {
				box-shadow: 0 0 10px rgba(0, 229, 255, 0.9);
			}
		}

		.game {
			position: relative;
			overflow: hidden;
		}

		.background {
			table-layout: fixed;
			border-spacing: 0;
		}

		.background td {
			padding: 0;
		}

		.lava,
		.actor {
			background: #36FF01;
		}

		.wall {
			background: #444;
			border: solid 3px #333;
			box-sizing: content-box;
		}

		.actor {
			position: absolute;
		}

		.player {
			background: linear-gradient(135deg, #00d2ff, #004bd7);
			border-radius: 4px;
			box-shadow: 0 0 14px #00d2ff;
			transition: height 0.1s ease, top 0.1s ease;
		}

		.player.has-shield {
			border: 2px solid #ffffff !important;
			outline: 3px solid #00e5ff !important;
			outline-offset: 1px !important;
			box-shadow: 0 0 20px #00e5ff, 0 0 40px #00b0ff, inset 0 0 10px #ffffff !important;
			animation: shieldAuraGlow 0.8s infinite alternate;
		}

		.player.invulnerable {
			animation: invulnerableBlink 0.15s infinite alternate !important;
		}

		@keyframes shieldAuraGlow {
			from {
				outline-color: #00e5ff;
				box-shadow: 0 0 15px #00e5ff, 0 0 30px #00b0ff, inset 0 0 6px #ffffff;
			}

			to {
				outline-color: #ffffff;
				box-shadow: 0 0 30px #00ffff, 0 0 55px #00e5ff, inset 0 0 14px #ffffff;
			}
		}

		@keyframes invulnerableBlink {
			0% {
				opacity: 0.3;
				filter: brightness(200%);
			}

			100% {
				opacity: 1;
				filter: brightness(100%);
			}
		}

		.lost .player {
			background: #ff3333;
			box-shadow: 0 0 20px #ff0000;
		}

		.won .player {
			background: #00ff66;
			box-shadow: 0 0 20px #00ff66;
		}

		.shield {
			background: url('../images/shield.png') no-repeat center center !important;
			background-size: 100% 100% !important;
			border-radius: 50%;
			box-shadow: 0 0 22px #00e5ff, 0 0 45px rgba(0, 229, 255, 0.8);
			animation: shieldItemPulse 1.2s infinite alternate;
			z-index: 6;
		}

		@keyframes shieldItemPulse {
			from {
				box-shadow: 0 0 14px #00e5ff, 0 0 28px rgba(0, 229, 255, 0.6);
				transform: scale(1.0);
			}

			to {
				box-shadow: 0 0 32px #00ffff, 0 0 60px rgba(0, 229, 255, 1);
				transform: scale(1.22);
			}
		}

		.coin {
			background: radial-gradient(circle, #fff700, #ff8800);
			border-radius: 50%;
			box-shadow: 0 0 12px #ffbb00;
			animation: coinGlow 1.2s infinite alternate;
		}

		.spring {
			background: linear-gradient(180deg, #00ffcc, #008866);
			border-top: 3px solid #ffffff;
			border-radius: 4px 4px 0 0;
			box-shadow: 0 0 15px #00ffcc;
			animation: springPulse 1s infinite alternate;
		}

		.enemy {
			background: linear-gradient(135deg, #09ff00, #00ffb3);
			border-radius: 6px;
			box-shadow: 0 0 14px #09ff00;
			animation: enemyPulse 0.8s infinite alternate;
		}

		.trackingEnemy {
			background: linear-gradient(135deg, #ffaa00, #ff3300);
			border-radius: 50%;
			box-shadow: 0 0 16px #ff3300;
			animation: trackingPulse 0.6s infinite alternate;
		}

		.ladder {
			background: url('../images/stairs.png') no-repeat center center !important;
			background-size: 100% 100% !important;
			z-index: 4;
		}

		/* Controls Guide Footer */
		.controls-guide {
			position: fixed;
			bottom: 12px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 0.9rem;
			color: rgba(255, 255, 255, 0.8);
			background: rgba(0, 0, 0, 0.7);
			padding: 6px 20px;
			border-radius: 20px;
			border: 1px solid rgba(54, 255, 1, 0.3);
			letter-spacing: 0.5px;
		}

		@keyframes coinGlow {
			from {
				box-shadow: 0 0 8px #ffbb00;
			}

			to {
				box-shadow: 0 0 18px #ffff00;
			}
		}

		@keyframes springPulse {
			from {
				transform: scaleY(0.95);
			}

			to {
				transform: scaleY(1.05);
			}
		}

		@keyframes enemyPulse {
			from {
				box-shadow: 0 0 8px #09ff00;
			}

			to {
				box-shadow: 0 0 18px #00ffb3;
			}
		}

		@keyframes trackingPulse {
			from {
				box-shadow: 0 0 10px #ff3300;
				transform: scale(0.95);
			}

			to {
				box-shadow: 0 0 20px #ffaa00;
				transform: scale(1.05);
			}
		}

		@keyframes pulseRed {
			0% {
				box-shadow: 0 0 5px #ff0000;
			}

			50% {
				box-shadow: 0 0 15px #ff0000;
			}

			100% {
				box-shadow: 0 0 5px #ff0000;
			}
		}

		.turret {
			background: radial-gradient(circle at 40% 40%, #666, #222);
			border: 2px solid #ff3333;
			border-radius: 4px;
			box-shadow: 0 0 12px rgba(255, 50, 50, 0.7), inset 0 0 6px rgba(0, 0, 0, 0.5);
			overflow: visible;
			z-index: 5;
		}

		.turret-barrel {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 14px;
			height: 5px;
			margin-top: -2.5px;
			margin-left: 0;
			transform-origin: 0% 50%;
			background: linear-gradient(90deg, #888, #ff4444, #ffaa00);
			border-radius: 0 3px 3px 0;
			box-shadow: 0 0 8px rgba(255, 100, 50, 0.9);
		}


		.bullet {
			background: radial-gradient(circle at 40% 40%, #ffff00, #ffaa00, #ff3300);
			border-radius: 50%;
			box-shadow:
				0 0 6px #ffaa00,
				0 0 14px rgba(255, 80, 0, 0.8),
				0 0 22px rgba(255, 50, 0, 0.5);
			animation: bulletGlow 0.3s infinite alternate;
			z-index: 10;
		}

		@keyframes bulletGlow {
			from {
				box-shadow:
					0 0 6px #ffaa00,
					0 0 14px rgba(255, 80, 0, 0.8),
					0 0 22px rgba(255, 50, 0, 0.5);
			}

			to {
				box-shadow:
					0 0 10px #ffff00,
					0 0 20px rgba(255, 100, 0, 1),
					0 0 30px rgba(255, 50, 0, 0.7);
			}
		}

		/* Cannon - dark armored look with purple-red menacing glow */
		.cannon {
			background: radial-gradient(circle at 35% 35%, #555, #1a1a2e);
			border: 2px solid #9b59b6;
			border-radius: 6px;
			box-shadow: 0 0 14px rgba(155, 89, 182, 0.8), inset 0 0 8px rgba(0, 0, 0, 0.6);
			overflow: visible;
			z-index: 5;
			animation: cannonIdle 2s infinite alternate;
		}

		.cannon-barrel {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 22px;
			height: 10px;
			margin-top: -5px;
			margin-left: 0;
			transform-origin: 0% 50%;
			background: linear-gradient(90deg, #666, #9b59b6, #c300ff);
			border-radius: 0 5px 5px 0;
			box-shadow: 0 0 12px rgba(155, 89, 182, 0.9);
		}

		@keyframes cannonIdle {
			from {
				box-shadow: 0 0 10px rgba(155, 89, 182, 0.6), inset 0 0 6px rgba(0, 0, 0, 0.6);
			}

			to {
				box-shadow: 0 0 20px rgba(155, 89, 182, 1), inset 0 0 6px rgba(0, 0, 0, 0.6);
			}
		}

		/* Cannon Ball - glowing yellow-orange projectile */
		.cannonBall {
			background: radial-gradient(circle at 35% 35%, #ffffff, #ffee00, #ff7700, #cc3300);
			border-radius: 50%;
			box-shadow:
				0 0 6px #e5ff00,
				0 0 14px rgba(255, 174, 0, 0.8),
				0 0 22px rgb(255, 136, 0);
			animation: cannonBallGlow 0.25s infinite alternate;
			z-index: 10;
		}

		@keyframes cannonBallGlow {
			from {
				box-shadow:
					0 0 6px #e5ff00,
					0 0 14px rgba(255, 174, 0, 0.8),
					0 0 22px rgb(255, 136, 0);
			}

			to {
				box-shadow:
					0 0 12px #fbff00,
					0 0 24px rgb(255, 187, 0),
					0 0 36px rgb(255, 145, 0);
			}
		}

		/* Explosion - fiery blast with expanding ring */
		.explosion {
			background: radial-gradient(circle,
					rgba(255, 255, 200, 0.9) 0%,
					rgba(255, 180, 50, 0.8) 20%,
					rgba(255, 80, 0, 0.6) 45%,
					rgba(200, 30, 0, 0.4) 65%,
					rgba(100, 0, 0, 0.1) 85%,
					transparent 100%);
			border-radius: 50%;
			box-shadow:
				0 0 20px rgba(255, 150, 0, 0.9),
				0 0 40px rgba(255, 80, 0, 0.6),
				0 0 60px rgba(200, 30, 0, 0.3);
			z-index: 15;
			pointer-events: none;
		}

		/* Laser Emitter Starting Point (High-Tech Armored Base) */
		.laser-emitter {
			background: radial-gradient(circle at 35% 35%, #4a1525, #18050c) !important;
			border: 2px solid #ff0055 !important;
			border-radius: 5px;
			box-shadow:
				0 0 12px rgba(255, 0, 85, 0.6),
				inset 0 0 8px rgba(0, 0, 0, 0.9) !important;
			z-index: 15;
			overflow: visible;
			transition: all 0.2s ease;
		}

		.laser-emitter.charging {
			border-color: #ff3388 !important;
			box-shadow:
				0 0 20px #ff007f,
				inset 0 0 10px rgba(255, 0, 127, 0.7) !important;
			animation: emitterWarmup 0.12s infinite alternate;
		}

		.laser-emitter.on {
			border-color: #ffffff !important;
			box-shadow:
				0 0 25px #ff0055,
				0 0 45px #ff007f,
				inset 0 0 12px #ffffff !important;
			animation: emitterFire 0.08s infinite alternate;
		}

		/* Emitter Core Nozzle Lens */
		.laser-nozzle {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 10px;
			height: 10px;
			margin-top: -5px;
			margin-left: -5px;
			background: radial-gradient(circle, #ffffff 10%, #ff0055 60%, #990033 100%) !important;
			border-radius: 50%;
			box-shadow: 0 0 10px #ff0055, 0 0 20px #ff007f !important;
			z-index: 2;
		}

		.laser-emitter.charging .laser-nozzle {
			background: radial-gradient(circle, #ffffff 20%, #ff3388 70%, #ff0055 100%) !important;
			box-shadow: 0 0 15px #ff3388, 0 0 25px #ff007f !important;
		}

		.laser-emitter.on .laser-nozzle {
			background: radial-gradient(circle, #ffffff 40%, #ff007f 80%, #ff0033 100%) !important;
			box-shadow: 0 0 25px #ffffff, 0 0 40px #ff0055 !important;
		}

		/* Emitter Nozzle Barrel Extension */
		.laser-barrel {
			position: absolute;
			background: linear-gradient(90deg, #3a101d, #ff0055, #ff007f) !important;
			box-shadow: 0 0 8px #ff0055 !important;
			border-radius: 2px;
		}

		.laser-emitter.laser-x .laser-barrel {
			top: 50%;
			right: -5px;
			width: 8px;
			height: 6px;
			margin-top: -3px;
		}

		.laser-emitter.laser-y .laser-barrel {
			bottom: -5px;
			left: 50%;
			width: 6px;
			height: 8px;
			margin-left: -3px;
			background: linear-gradient(180deg, #3a101d, #ff0055, #ff007f) !important;
		}

		/* Laser Beam - Charging Warning Line (0.5s) */
		.laserCharging {
			background: rgba(255, 0, 85, 0.3) !important;
			border: 1px dashed rgba(255, 51, 136, 0.9) !important;
			box-shadow: 0 0 10px rgba(255, 0, 85, 0.6) !important;
			animation: laserChargeScan 0.1s infinite alternate;
			z-index: 12;
		}

		/* Laser Beam - Active Lethal Red Beam with Alternating Pink-Red Glow (3.0s) */
		.laserOn {
			background: linear-gradient(90deg, #ffffff 0%, #ff0055 25%, #ff007f 50%, #ff0033 75%, #ffffff 100%) !important;
			background-size: 200% 200% !important;
			animation:
				laserEnergyStream 0.3s linear infinite,
				pinkRedGlowAlternate 0.25s ease-in-out infinite alternate,
				laserFlicker 0.08s infinite alternate;
			z-index: 14;
		}

		.laserOn.laser-y {
			background: linear-gradient(180deg, #ffffff 0%, #ff0055 25%, #ff007f 50%, #ff0033 75%, #ffffff 100%) !important;
			background-size: 200% 200% !important;
		}

		.laser-energy-flow {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: repeating-linear-gradient(90deg,
					transparent,
					transparent 12px,
					rgba(255, 255, 255, 0.7) 12px,
					rgba(255, 255, 255, 0.7) 24px) !important;
			animation: energyFlowMove 0.25s linear infinite;
		}

		@keyframes emitterWarmup {
			from {
				transform: scale(0.96);
			}

			to {
				transform: scale(1.06);
			}
		}

		@keyframes emitterFire {
			from {
				transform: scale(1.0);
			}

			to {
				transform: scale(1.1);
			}
		}

		@keyframes laserChargeScan {
			from {
				opacity: 0.25;
			}

			to {
				opacity: 0.95;
			}
		}

		@keyframes laserEnergyStream {
			0% {
				background-position: 0% 50%;
			}

			100% {
				background-position: 200% 50%;
			}
		}

		/* Alternating Pink & Red Neon Glow */
		@keyframes pinkRedGlowAlternate {
			0% {
				box-shadow:
					0 0 10px #ffffff,
					0 0 20px #ff0055,
					0 0 35px #ff007f,
					0 0 55px rgba(255, 0, 85, 0.9);
			}

			50% {
				box-shadow:
					0 0 14px #ffffff,
					0 0 28px #ff007f,
					0 0 45px #ff0033,
					0 0 65px rgba(255, 0, 127, 0.95);
			}

			100% {
				box-shadow:
					0 0 18px #ffffff,
					0 0 32px #ff0033,
					0 0 50px #ff0055,
					0 0 75px rgba(255, 0, 51, 1);
			}
		}

		@keyframes laserFlicker {
			from {
				opacity: 0.88;
				transform: scaleY(0.92);
			}

			to {
				opacity: 1.0;
				transform: scaleY(1.08);
			}
		}

		@keyframes energyFlowMove {
			0% {
				background-position: 0 0;
			}

			100% {
				background-position: 48px 0;
			}
		}
	</style>
</head>

<body>
	<!-- HUD Header -->
	<div class="hud-container">
		<div class="hud-item hud-level" id="hudLevel">Level 1 / 7</div>
		<div class="hud-item hud-coins" id="hudCoins">🪙 0 / 0</div>
		<div class="hud-item hud-shield" id="hudShield"></div>
		<div class="hud-item">
			<span class="hud-mode mode-normal" id="hudMode">NORMAL</span>
		</div>
		<div class="hud-item hud-lives" id="hudLives"></div>
	</div>

	<!-- Audio -->
	<audio id="bgSound" src="../audio/survive.mp3" loop></audio>

	<!-- Controls Footer -->
	<div class="controls-guide">Controls: <b>WASD</b> or <b>Arrow Keys</b></div>

	<script>
		window.addEventListener('load', () => {
			const audio = document.getElementById('bgSound');
			if (audio) {
				audio.volume = 0.4;
				audio.play().catch(() => {
					const unmute = () => {
						audio.play();
						document.removeEventListener('click', unmute);
						document.removeEventListener('keydown', unmute);
					};
					document.addEventListener('click', unmute);
					document.addEventListener('keydown', unmute);
				});
			}
		});
	</script>
	<script type="module" src="../js/start.js"></script>
</body>

</html>
